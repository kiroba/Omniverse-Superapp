name: Build The Omniverse Superapp APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # tag builds publish a pre-release with the APK

jobs:
  android:
    name: Android arm64 (test build, debug key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Unit tests
        run: flutter test
      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation \
            --dart-define=OMNI_APP=omniverse-superapp --dart-define=OMNI_BUILD=$((1000 + ${{ github.run_number }}))
          cp build/app/outputs/flutter-apk/app-release.apk omniverse-superapp-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: omniverse-superapp-android-arm64
          path: omniverse-superapp-android-arm64.apk
      - name: Publish pre-release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: omniverse-superapp-android-arm64.apk
          body: "Pre-alpha test build (debug signing key). Package com.omniverse.superapp: uninstall the Superapp from The-Omniverse releases first, they share an app id but not a signing key (issue #84)."
